[package]
name = "airwand"
version = "0.1.0"
edition = "2021"
description = "Point your phone at your PC and the cursor follows (Bluetooth)"

[lib]
name = "airwand"
path = "src/lib.rs"

[[bin]]
name = "airwand"
path = "src/main.rs"

[dependencies]
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies.windows]
version = "=0.58.0"
features = [
  "Devices_Bluetooth",
  "Devices_Bluetooth_GenericAttributeProfile",
  "Foundation",
  "Foundation_Collections",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Media",
  "Win32_Security",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
