# Publishes Web/ to GitHub Pages (HTTPS is required for Web Bluetooth and motion sensors).
# Enable it once: Settings > Pages > Source: GitHub Actions.
name: Deploy web page
on:
  push:
    branches: [main]
    paths: ['Web/**']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: Web }
      - id: d
        uses: actions/deploy-pages@v4
